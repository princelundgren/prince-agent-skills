name: Bug report
description: A hook fails, an install step doesn't work, or a rule or skill makes an agent do the wrong thing.
labels: ["bug"]
body:
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      options:
        - Claude Code
        - Qwen Code
        - Kiro CLI
        - Other (say which below)
    validations:
      required: true

  - type: input
    id: harness-version
    attributes:
      label: Harness version
      description: The output of `claude --version`, `qwen --version` or `kiro-cli --version`.
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: For a rule or skill, what the agent did and what the text should have made it do.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The prompt or command, and any error text, verbatim.
    validations:
      required: true
